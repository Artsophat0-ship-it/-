<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>គណនារំលស់ម៉ូតូ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}.box{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 6px 25px #0001}h1{font-size:28px;margin:4px 0 8px}.sub{color:#718096;margin-bottom:22px}label{display:block;font-weight:700;margin:15px 0 6px}input,select{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:13px;font-size:19px;background:#fff}button{width:100%;border:0;border-radius:14px;padding:17px;background:#1264e8;color:#fff;font-size:20px;font-weight:700;margin-top:20px}.result{margin-top:20px;padding:18px;border-radius:16px;background:#eef5ff;line-height:1.8}.big{font-size:30px;font-weight:800;color:#1264e8}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tablewrap{overflow-x:auto;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:620px;background:#fff}th,td{border:1px solid #dbe3ec;padding:9px;text-align:right;white-space:nowrap}th{background:#eaf2ff;text-align:center}.title{text-align:left!important}@media(max-width:430px){.row{grid-template-columns:1fr}}
@media print{
 body{background:#fff}.box{max-width:none;padding:0}.card{box-shadow:none;padding:8px}
 input,select,button{display:none}.sub{margin-bottom:8px}
 .result{background:#fff;border:1px solid #ddd}.tablewrap{overflow:visible}
 table{min-width:0;font-size:10px}th,td{padding:5px}
 h1{font-size:20px}h2{font-size:15px}
}
.printbtn{background:#16a34a!important}
</style></head><body><div class="box"><div class="card">
<h1>🏍️ គណនារំលស់ម៉ូតូ</h1><div class="sub">គណនាប្រាក់ដើម • ការប្រាក់ • បង់ប្រចាំខែ • តារាងបង់ប្រាក់</div>
<label>👤 ឈ្មោះអតិថិជន</label><input id="name" placeholder="បញ្ចូលឈ្មោះអតិថិជន">
<div class="row"><div><label>🏍️ ម៉ាកម៉ូតូ</label><input id="brand" placeholder="ឧ. Honda"></div><div><label>🛵 ម៉ូដែល</label><input id="model" placeholder="ឧ. Scoopy 2026"></div></div>
<label>📱 លេខទូរស័ព្ទ</label><input id="phone" type="tel" placeholder="បញ្ចូលលេខទូរស័ព្ទ">
<label>💰 តម្លៃម៉ូតូ ($)</label><input id="p" type="number" value="3150">
<label>💵 ប្រាក់កក់ ($)</label><input id="d" type="number" value="0">
<label>📊 ការប្រាក់ (% ក្នុង 1 ខែ)</label><input id="r" type="number" value="1.1" step="0.1">
<label>📅 ចំនួនខែ</label><input id="m" type="number" value="36">
<label>របៀបគណនា</label><select><option>Flat / ការប្រាក់ថេរ</option></select>
<button onclick="go()">🧮 គណនារំលស់</button><button class="printbtn" onclick="window.print()">🖨️ ព្រីន / Save PDF</button>
<div id="out" class="result">បញ្ចូលព័ត៌មាន រួចចុច «គណនារំលស់»</div>
<div id="schedule"></div>
</div></div>
<script>
function money(x){return '$'+Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function go(){
 let name=document.getElementById('name').value.trim(),brand=document.getElementById('brand').value.trim(),model=document.getElementById('model').value.trim(),phone=document.getElementById('phone').value.trim();
 let p=+document.getElementById('p').value||0,d=+document.getElementById('d').value||0,r=(+document.getElementById('r').value||0)/100,m=Math.max(1,Math.floor(+document.getElementById('m').value||1));
 let principal=Math.max(0,p-d),interest=principal*r*m,total=principal+interest,monthly=total/m,pi=principal/m,mi=principal*r,remaining=principal;
 document.getElementById('out').innerHTML='<b>ព័ត៌មានអតិថិជន</b><br>ឈ្មោះ៖ '+(name||'—')+'<br>ម៉ាក/ម៉ូដែល៖ '+(brand||'—')+' / '+(model||'—')+'<br>ទូរស័ព្ទ៖ '+(phone||'—')+'<hr>ប្រាក់ដើម៖ <b>'+money(principal)+'</b><br>ការប្រាក់សរុប៖ <b>'+money(interest)+'</b><br>ត្រូវបង់សរុប៖ <b>'+money(total)+'</b><br>បង់ប្រចាំខែ៖ <div class="big">'+money(monthly)+'</div>';
 let rows='';
 for(let i=1;i<=m;i++){let pp=(i===m)?remaining:pi;let rem=Math.max(0,remaining-pp);rows+='<tr><td>'+i+'</td><td>'+money(remaining)+'</td><td>'+money(pp)+'</td><td>'+money(mi)+'</td><td><b>'+money(pp+mi)+'</b></td><td>'+money(rem)+'</td></tr>';remaining=rem;}
 document.getElementById('schedule').innerHTML='<h2>📋 តារាងបង់ប្រាក់</h2><div class="tablewrap"><table><thead><tr><th>ខែ</th><th>ប្រាក់ដើមមុនបង់</th><th>បង់ប្រាក់ដើម</th><th>ការប្រាក់</th><th>បង់សរុប</th><th>នៅសល់</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
</script></body></html>
